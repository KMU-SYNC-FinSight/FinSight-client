<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <!-- 상태바 색. 앱 상단이 흰색이라 흰색으로 맞춘다 (manifest 의 theme_color 와 동일). -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="소상공인 매장 운영 데이터 분석 및 운영 안정성 지표 서비스" />
    <!-- 표준 이름. apple- 접두사 버전은 deprecated 되어 Chrome 이 경고를 낸다. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      black-translucent: 콘텐츠가 상태바 아래까지 올라간다.
      스플래시 노란색이 시계 영역까지 꽉 차게 하려면 이 값이어야 한다.
      (iOS standalone 은 theme-color 를 보지 않는다 — 이 meta 만 따른다.)

      안전 영역은 프레임이 아니라 각 화면의 최상단 요소가 --safe-top 으로 채운다.
      프레임에서 한 번에 칠하면 그 색만 띠로 남는다.

      대가: 상태바 글자가 흰색으로 고정된다. 상단이 흰색인 화면에서는 시계·배터리가 흐리게 보인다.
      되돌리려면 이 값을 default 로 바꾸면 된다 (그러면 상태바에 색이 안 들어간다).
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinSight" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>FinSight</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
